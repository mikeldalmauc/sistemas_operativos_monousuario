server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # La web y los alumnos hablan con la API a través de este proxy: una sola dirección y puerto.
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
