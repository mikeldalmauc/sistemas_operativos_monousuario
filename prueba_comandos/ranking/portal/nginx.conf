# Portal · reverse proxy en el puerto 80. Cada aplicación cuelga de una ruta.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # --- Ranking de las pruebas de comandos (contenedor "web", que a su vez habla con "api") ---
    location = /ranking-comandos { return 301 /ranking-comandos/; }
    location /ranking-comandos/ {
        proxy_pass http://web:80/;          # la barra final quita el prefijo /ranking-comandos/
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Prefix /ranking-comandos;
    }

    # --- Para añadir otra aplicación: copia el bloque de arriba cambiando ruta y servicio,
    #     y añade su caja en apps.js ---
}
