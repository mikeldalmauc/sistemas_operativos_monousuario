# Despliegue automático del ranking al hacer push a main (opcional).
# Solo se ejecuta si en el repo (Settings → Secrets and variables → Actions) existen:
#   Variable  DESPLIEGUE_AUTOMATICO = si
#   Secrets   DESPLIEGUE_SSH_KEY  (clave privada ed25519 SOLO para esto; su .pub va en ranking/servidor/claves_ssh.pub)
#             DESPLIEGUE_SSH_HOST (vdi.fpzornotzalh.eus)   DESPLIEGUE_SSH_PORT (443)
#             DESPLIEGUE_SSH_USER (el ID del bastión de Isard)
name: Desplegar ranking
on:
  push:
    branches: [main]
    paths: ['prueba_comandos/ranking/**']
  workflow_dispatch:
env:
  # Clave PÚBLICA de host del bastión de Isard (vdi.fpzornotzalh.eus:443). Va fijada aquí porque el
  # bastión no contesta a ssh-keyscan. Si cambia: ssh-keygen -F '[vdi.fpzornotzalh.eus]:443'
  CLAVE_HOST_BASTION: ssh-rsa 
jobs:
  desplegar:
    if: ${{ vars.DESPLIEGUE_AUTOMATICO == 'si' }}
    runs-on: ubuntu-latest
    steps:
      - name: Clave SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # tr quita los \r por si la clave se pegó desde Windows
          printf '%s\n' "${{ secrets.DESPLIEGUE_SSH_KEY }}" | tr -d '\r' > ~/.ssh/despliegue && chmod 600 ~/.ssh/despliegue
          echo "[${{ secrets.DESPLIEGUE_SSH_HOST }}]:${{ secrets.DESPLIEGUE_SSH_PORT }} $CLAVE_HOST_BASTION" > ~/.ssh/known_hosts
      # git pull antes del script: así funciona aunque el servidor aún no tenga desplegar.sh y siempre corre la versión nueva
      - name: Desplegar por SSH (bastión de Isard)
        run: |
          ssh -i ~/.ssh/despliegue -p "${{ secrets.DESPLIEGUE_SSH_PORT }}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "${{ secrets.DESPLIEGUE_SSH_USER }}@${{ secrets.DESPLIEGUE_SSH_HOST }}" \
            "cd ~/sistemas_operativos_monousuario && git pull -q --ff-only && bash prueba_comandos/ranking/servidor/desplegar.sh"
